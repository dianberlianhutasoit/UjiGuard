<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Masuk | Tervia</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="auth-flow.css">
    <link rel="stylesheet" href="../../assets/css/ujiguard-theme.css">
  </head>
  <body class="login-body">
    <main class="login-wrap">
      <section class="login-story">
        <a class="brand brand-light auth-brand" href="../../index.html">
          <span class="brand-mark brand-logo" aria-hidden="true"><img src="../../assets/img/tervia-mark.svg" alt=""></span>
          <span><strong>Tervia</strong><small>UJIAN TERJAGA, PROSES TERARAH</small></span>
        </a>
        <div class="brand-hero" aria-label="Logo Tervia">
          <img class="tervia-lockup" src="../../assets/img/tervia-logo.svg" alt="Logo Tervia">
        </div>
        <div class="auth-story-copy">
          <h1>Selamat datang<br><em>di Tervia.</em></h1>
          <p>Masukkan ID yang terdaftar untuk melanjutkan.</p>
        </div>
        <div class="story-foot"><span>Tervia</span><span>Sistem Pendukung Pengawasan Ujian</span></div>
      </section>

      <section class="login-panel">
        <div class="mobile-brand"><span class="brand-mark brand-logo"><img src="../../assets/img/tervia-mark.svg" alt="Logo Tervia"></span><strong>Tervia</strong></div>
        <div class="login-form-wrap auth-form-wrap">
          <h2>Masuk ke akun Anda</h2>

          <form id="id-form">
            <div class="field">
              <label for="user-id">ID pengguna</label>
              <input id="user-id" name="user-id" type="text" placeholder="Masukkan ID pengguna" autocomplete="username" autocapitalize="characters" required>
            </div>
            <div class="login-error hide" id="id-error" role="alert"></div>
            <button class="btn btn-primary login-submit" type="submit">Lanjutkan <span aria-hidden="true">→</span></button>
          </form>

          <form id="staff-form" class="hide">
            <div class="selected-id">ID terverifikasi <strong id="staff-id-label"></strong></div>
            <div class="field">
              <label for="staff-email">Email</label>
               <input id="staff-email" name="email" type="email" placeholder="nama@tervia.demo" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="staff-password">Kata sandi</label>
              <div class="password-wrap">
                <input id="staff-password" name="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
                <button class="eye-btn" type="button" id="toggle-password" aria-label="Tampilkan kata sandi">◉</button>
              </div>
            </div>
            <div class="login-error hide" id="staff-error" role="alert"></div>
            <button class="btn btn-primary login-submit" type="submit">Masuk <span aria-hidden="true">→</span></button>
            <button class="auth-back" type="button" id="back-to-id">Kembali ke ID</button>
          </form>
        </div>
        <footer class="login-footer"><span>Tervia · Sistem Pendukung Pengawasan Ujian</span></footer>
      </section>
    </main>
    <script src="../../assets/js/admin-store.js"></script>
    <script src="../../assets/js/demo-users.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="login.js"></script>
  </body>
</html>
