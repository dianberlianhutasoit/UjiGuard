<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard Pengawas | UjiGuard</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../role-placeholder.css">
    <link rel="stylesheet" href="proctor-dashboard.css">
  </head>
  <body class="proctor-page">
    <div class="proctor-shell">
      <aside class="proctor-sidebar">
        <a class="proctor-logo" href="index.html"><span class="role-brand-mark">U</span><span><strong>UjiGuard</strong><small>PORTAL PENGAWAS</small></span></a>
        <nav class="proctor-nav" aria-label="Menu pengawas">
          <button data-view="dashboard" class="is-active">Dashboard</button>
          <button data-view="monitor">Monitor Peserta</button>
          <button data-view="indications">Indikasi <b id="nav-review-count">0</b></button>
          <button data-view="violations">Rekap Pelanggaran</button>
        </nav>
        <div class="proctor-account"><span class="admin-avatar">PG</span><span><strong id="proctor-name"></strong><small id="proctor-id"></small></span><button id="proctor-logout" type="button" aria-label="Keluar">Keluar</button></div>
      </aside>
      <main class="proctor-main">
        <header class="proctor-topbar"><div><div class="eyebrow">MONITORING UJIAN</div><h1 id="page-title">Dashboard Pengawas</h1></div><div class="proctor-live-status"><i></i> Data diperbarui otomatis</div></header>
        <div class="proctor-content">
          <div id="session-picker"></div>
          <div id="proctor-view"></div>
        </div>
      </main>
    </div>
    <dialog class="violation-dialog" id="violation-dialog" aria-labelledby="violation-dialog-title">
      <form id="violation-form">
        <div class="eyebrow">TINDAKAN PENGAWAS</div>
        <h2 id="violation-dialog-title">Catat Pelanggaran</h2>
        <label for="violation-type">Jenis pelanggaran</label>
        <select id="violation-type" required>
          <option value="">Pilih jenis pelanggaran</option>
          <option>Perangkat tidak sesuai</option>
          <option>Aktivitas mencurigakan</option>
          <option>Komunikasi tidak diperbolehkan</option>
          <option>Pelanggaran tata tertib</option>
          <option>Lainnya</option>
        </select>
        <label for="violation-note">Catatan pengawas</label>
        <textarea id="violation-note" rows="4" required placeholder="Tuliskan hasil verifikasi singkat"></textarea>
        <div class="violation-dialog-actions">
          <button class="btn btn-light" id="cancel-violation" type="button">Batal</button>
          <button class="btn btn-primary" type="submit">Simpan Pelanggaran</button>
        </div>
      </form>
    </dialog>
    <video id="proctor-video" autoplay playsinline></video>
    <script src="../../assets/js/admin-store.js"></script>
    <script src="../../assets/js/demo-users.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/store.js"></script>
    <script src="../../assets/js/webrtc.js"></script>
    <script src="proctor-dashboard.js"></script>
  </body>
</html>
