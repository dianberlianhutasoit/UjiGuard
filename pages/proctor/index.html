<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard Pengawas | Tervia</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../role-placeholder.css">
    <link rel="stylesheet" href="proctor-dashboard.css">
    <link rel="stylesheet" href="../../assets/css/role-sidebar.css">
    <link rel="stylesheet" href="../../assets/css/ujiguard-theme.css">
  </head>
  <body class="proctor-page">
    <div class="proctor-shell">
      <aside class="proctor-sidebar">
        <a class="proctor-logo" href="index.html"><span class="role-brand-mark brand-logo"><img src="../../assets/img/tervia-mark.svg" alt="Logo Tervia"></span><span><strong>Tervia</strong><small>PORTAL PENGAWAS</small></span></a>
        <nav class="proctor-nav" aria-label="Menu pengawas">
          <button data-view="dashboard" class="is-active"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
          <button data-view="monitor"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M7 9h10m-10 4h6"/></svg>Monitor Peserta</button>
          <button data-view="indications"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 20H2L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg>Indikasi <b id="nav-review-count">0</b></button>
          <button data-view="violations"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4V21H6z"/><path d="M14 3.5V8h4m-9 4h6m-6 4h6"/></svg>Rekap Pelanggaran</button>
          <button data-view="history"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Riwayat Pemeriksaan</button>
        </nav>
        <div class="proctor-account"><span class="admin-avatar">PG</span><span><strong id="proctor-name"></strong><small id="proctor-id"></small></span><button id="proctor-logout" type="button" aria-label="Keluar">Keluar</button></div>
      </aside>
      <main class="proctor-main">
        <header class="proctor-topbar"><div><h1 id="page-title">Dashboard Pengawas</h1></div></header>
        <div class="proctor-content">
          <div id="session-picker"></div>
          <div id="proctor-view"></div>
        </div>
      </main>
    </div>
    <dialog class="violation-dialog" id="violation-dialog" aria-labelledby="violation-dialog-title">
      <form id="violation-form">
        <div class="eyebrow">TINDAKAN PENGAWAS</div>
        <h2 id="violation-dialog-title">Catat Pelanggaran</h2>
        <label for="violation-type">Jenis pelanggaran</label>
        <select id="violation-type" required>
          <option value="">Pilih jenis pelanggaran</option>
          <option>Perangkat tidak sesuai</option>
          <option>Aktivitas mencurigakan</option>
          <option>Komunikasi tidak diperbolehkan</option>
          <option>Pelanggaran tata tertib</option>
          <option>Lainnya</option>
        </select>
        <label for="violation-note">Catatan pengawas</label>
        <textarea id="violation-note" rows="4" required placeholder="Tuliskan hasil verifikasi singkat"></textarea>
        <div class="violation-dialog-actions">
          <button class="btn btn-light" id="cancel-violation" type="button">Batal</button>
          <button class="btn btn-primary" type="submit">Simpan Pelanggaran</button>
        </div>
      </form>
    </dialog>
    <video id="proctor-video" autoplay playsinline></video>
    <script src="../../assets/js/admin-store.js"></script>
    <script src="../../assets/js/demo-users.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/store.js"></script>
    <script src="../../assets/js/webrtc.js"></script>
    <script src="proctor-dashboard.js"></script>
  </body>
</html>
