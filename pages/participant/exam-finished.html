<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ujian Selesai | Tervia</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../role-placeholder.css" />
    <link rel="stylesheet" href="participant.css" />
    <link rel="stylesheet" href="../../assets/css/ujiguard-theme.css" />
  </head>
  <body class="role-page">
    <main class="role-shell identity-shell">
      <div class="role-brand">
        <span class="role-brand-mark brand-logo"
          ><img
            src="../../assets/img/tervia-logo.png"
            alt="Logo Tervia" /></span
        ><strong>Tervia</strong>
      </div>
      <section class="role-card">
        <div class="eyebrow">SESI UJIAN</div>
        <h1 id="finished-title">Sesi ujian berakhir</h1>
        <p class="role-intro" id="finished-message"></p>
        <dl class="identity-details">
          <div>
            <dt>Nama peserta</dt>
            <dd id="finished-name"></dd>
          </div>
          <div>
            <dt>ID peserta</dt>
            <dd id="finished-id"></dd>
          </div>
          <div>
            <dt>Status sesi</dt>
            <dd id="finished-status"></dd>
          </div>
          <div>
            <dt>Waktu selesai atau keluar</dt>
            <dd id="finished-time"></dd>
          </div>
        </dl>
        <a class="btn btn-primary role-primary" href="../login/index.html"
          >Kembali ke halaman awal</a
        >
      </section>
    </main>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/store.js"></script>
    <script src="exam-finished.js"></script>
  </body>
</html>
